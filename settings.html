<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>School Settings - EduCore School Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="assets/app.css" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                "primary-fixed": "#d8e3fb", "surface-container-high": "#e6e8ea", "surface-dim": "#d8dadc",
                "tertiary-container": "#422000", "on-secondary-fixed": "#002114", "on-tertiary-fixed-variant": "#6e3900",
                "tertiary": "#240f00", "on-surface": "#191c1e", "on-secondary": "#ffffff", "background": "#f7f9fb",
                "on-tertiary-fixed": "#2f1500", "on-surface-variant": "#45474c", "on-primary-fixed-variant": "#3c475a",
                "on-background": "#191c1e", "on-primary-container": "#8590a6", "surface-tint": "#545f73",
                "surface-container-lowest": "#ffffff", "surface-container-highest": "#e0e3e5", "surface-container-low": "#f2f4f6",
                "on-error-container": "#93000a", "on-secondary-fixed-variant": "#005137", "surface": "#f7f9fb",
                "on-tertiary": "#ffffff", "primary-fixed-dim": "#bcc7de", "on-primary": "#ffffff",
                "on-secondary-container": "#00714e", "on-tertiary-container": "#d97705", "outline": "#75777d",
                "secondary": "#006c4a", "inverse-primary": "#bcc7de", "surface-variant": "#e0e3e5",
                "secondary-container": "#82f5c1", "primary": "#091426", "outline-variant": "#c5c6cd",
                "surface-bright": "#f7f9fb", "tertiary-fixed-dim": "#ffb77d", "secondary-fixed": "#85f8c4",
                "error-container": "#ffdad6", "inverse-on-surface": "#eff1f3", "tertiary-fixed": "#ffdcc3",
                "on-primary-fixed": "#111c2d", "primary-container": "#1e293b", "error": "#ba1a1a",
                "secondary-fixed-dim": "#68dba9", "on-error": "#ffffff", "inverse-surface": "#2d3133",
                "surface-container": "#eceef0"
            },
            borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
            spacing: { md: "16px", "grid-gutter": "20px", xs: "4px", "grid-margin": "24px", sm: "12px", lg: "24px", xl: "32px", base: "8px" },
            fontFamily: {
                "body-lg": ["Inter"], "headline-md": ["Inter"], "body-md": ["Inter"], "label-md": ["Inter"],
                "headline-xl": ["Inter"], "headline-lg": ["Inter"], "data-tabular": ["Inter"], "headline-lg-mobile": ["Inter"]
            },
            fontSize: {
                "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                "headline-xl": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "700" }],
                "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.01em", fontWeight: "600" }],
                "data-tabular": ["14px", { lineHeight: "20px", fontWeight: "500" }],
                "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }]
            }
        }
    }
}
</script>

</head>
<body class="bg-background text-on-background font-body-lg" data-page="settings" >
<div class="flex min-h-screen">
  <div id="sidebar-root"></div>
  <div class="flex-1 min-w-0 flex flex-col">
    <div id="header-root"></div>
    <main class="flex-1 p-4 lg:p-6 max-w-[1600px] w-full mx-auto">

  
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h2 class="font-headline-md text-headline-md text-on-surface">School Settings</h2>
        <p class="text-body-md font-body-md text-on-surface-variant mt-1">Manage your school's core information.</p>
      </div>
      <div class="flex items-center gap-2 shrink-0"><a href="#" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg bg-secondary text-on-secondary text-label-md text-label-md hover:bg-on-secondary-fixed-variant transition-colors shadow-sm"><span class="material-symbols-outlined text-[18px]">check</span>Save Changes</a></div>
    </div>
  
    <div class="elevation-1 rounded-xl bg-surface-container-lowest border border-outline-variant/50 overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-outline-variant/50">
        <h3 class="font-headline-md text-headline-md text-on-surface">School Information</h3>
        <div class="flex items-center gap-2"></div>
      </div>
      <div class="p-5">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      
    <div class="">
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">School Name</label>
      <input type="text" placeholder="EduCore Public School" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary placeholder-on-surface-variant/50"/>
    </div>
      
    <div class="">
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">School Code</label>
      <input type="text" placeholder="EDU-KL-2026" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary placeholder-on-surface-variant/50"/>
    </div>
      
    <div class="">
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">Established Year</label>
      <input type="text" placeholder="1998" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary placeholder-on-surface-variant/50"/>
    </div>
      
    <div class="">
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">Principal Name</label>
      <input type="text" placeholder="Antony Xavier" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary placeholder-on-surface-variant/50"/>
    </div>
      
    <div class="">
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">Phone</label>
      <input type="text" placeholder="+91 484 234 5678" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary placeholder-on-surface-variant/50"/>
    </div>
      
    <div class="">
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">Email</label>
      <input type="text" placeholder="info@educore.edu" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary placeholder-on-surface-variant/50"/>
    </div>
      
    <div class="">
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">Website</label>
      <input type="text" placeholder="www.educore.edu" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary placeholder-on-surface-variant/50"/>
    </div>
      
    <div class="">
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">School Logo</label>
      <input type="file" placeholder="" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary placeholder-on-surface-variant/50"/>
    </div>
      
    <div class="sm:col-span-2">
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">Address</label>
      <input type="text" placeholder="Kakkanad, Ernakulam, Kerala - 682030" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary placeholder-on-surface-variant/50"/>
    </div>
      
    <div class="sm:col-span-2">
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">School Description</label>
      <input type="text" placeholder="A CBSE-affiliated school known for academics and sports." class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary placeholder-on-surface-variant/50"/>
    </div>
    </div>
  </div>
    </div>

    </main>
  </div>
</div>
<script src="assets/app.js"></script>
</body></html>
